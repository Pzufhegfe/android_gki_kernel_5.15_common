name: Build GKI with KernelSU

run-name: Build GKI ${{ inputs.ksu_branch || 'main' }} (${{ github.ref_name }})

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Branch'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - android13-5.15-2025-07

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: kernel_src

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip curl wget python3 bc rsync schedtool cpio ncurses-dev libxml2-utils inetutils-ping build-essential python3-pip
        
        # Install mkbootimg from AOSP
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg
        chmod +x mkbootimg/mkbootimg.py
        sudo mv mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg
        rm -rf mkbootimg

        # Install Repo
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Setup Build Environment
      run: |
        mkdir -p gki_build_workspace
        cd gki_build_workspace
        
        # Configure Git
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Initialize repo with depth 1 to save time and space
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
        
        mkdir -p .repo/local_manifests
        # Remove the default kernel/common to replace with ours
        cat > .repo/local_manifests/local.xml <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
            <remove-project name="kernel/common" />
        </manifest>
        EOF
        
        # Sync only necessary parts
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: Link Kernel Source
      run: |
        cd gki_build_workspace
        # Copy instead of symlink to avoid Bazel sandbox issues completely
        cp -r ../kernel_src common

    - name: Fix Clang Toolchain
      run: |
        cd gki_build_workspace
        CLANG_DIR="prebuilts/clang/host/linux-x86"
        CLANG_VER="clang-r547379"
        
        # Check if Clang exists
        if [ ! -d "$CLANG_DIR/$CLANG_VER" ]; then
            echo "Clang $CLANG_VER not found in workspace. Downloading..."
            mkdir -p "$CLANG_DIR/$CLANG_VER"
            
            # Try downloading tarball from Google Source (Much faster than git fetch)
            # Try 'master' branch first, then 'main'
            DOWNLOAD_SUCCESS=false
            for BRANCH in master main; do
                echo "Attempting to download tarball from $BRANCH..."
                if curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$BRANCH/$CLANG_VER.tar.gz" -o clang.tar.gz; then
                    echo "Download success from $BRANCH."
                    DOWNLOAD_SUCCESS=true
                    break
                fi
            done
            
            if [ "$DOWNLOAD_SUCCESS" = true ]; then
                echo "Extracting..."
                tar -xzf clang.tar.gz -C "$CLANG_DIR/$CLANG_VER"
                rm clang.tar.gz
            else
                echo "Tarball download failed. Falling back to slow git fetch..."
                # Fallback to git fetch
                cd "$CLANG_DIR"
                if [ ! -d ".git" ]; then
                    git init
                    git remote add origin "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
                fi
                git fetch --depth 1 origin master
                git checkout FETCH_HEAD -- "$CLANG_VER"
                cd ../../../..
            fi
            
            # Create BUILD file for Bazel if missing
            if [ ! -f "$CLANG_DIR/$CLANG_VER/BUILD" ] && [ ! -f "$CLANG_DIR/$CLANG_VER/BUILD.bazel" ]; then
                echo "Creating dummy BUILD file for Clang..."
                touch "$CLANG_DIR/$CLANG_VER/BUILD"
            fi
        else
            echo "Clang $CLANG_VER already exists."
        fi

    - name: Apply Fixes & Configs
      run: |
        cd gki_build_workspace
        KERNEL_SRC="common"
        
        # 1. ZRAM Fix
        GKI_DEFCONFIG="$KERNEL_SRC/arch/arm64/configs/gki_defconfig"
        if grep -q "CONFIG_ZRAM=y" "$GKI_DEFCONFIG"; then
            sed -i 's/CONFIG_ZRAM=y/CONFIG_ZRAM=m/' "$GKI_DEFCONFIG"
            sed -i 's/CONFIG_ZSMALLOC=y/CONFIG_ZSMALLOC=m/' "$GKI_DEFCONFIG"
        fi
        
        MODULES_LIST="$KERNEL_SRC/android/gki_system_dlkm_modules"
        if ! grep -q "drivers/block/zram/zram.ko" "$MODULES_LIST"; then
            echo "drivers/block/zram/zram.ko" >> "$MODULES_LIST"
            echo "mm/zsmalloc.ko" >> "$MODULES_LIST"
        fi

        # 2. Export task_is_booster
        CPUSET_C="$KERNEL_SRC/kernel/cgroup/cpuset.c"
        if ! grep -q "EXPORT_SYMBOL_GPL(task_is_booster)" "$CPUSET_C"; then
            echo "" >> "$CPUSET_C"
            echo "EXPORT_SYMBOL_GPL(task_is_booster);" >> "$CPUSET_C"
        fi

        # 3. Update KMI Symbol List
        SYMBOL_LIST="$KERNEL_SRC/android/abi_gki_aarch64"
        if ! grep -q "task_is_booster" "$SYMBOL_LIST"; then
            echo "task_is_booster" >> "$SYMBOL_LIST"
        fi
        
        # 4. Patch stamp.bzl to remove -maybe-dirty
        STAMP_BZL="build/kernel/kleaf/impl/stamp.bzl"
        if [ -f "$STAMP_BZL" ]; then
            sed -i 's/export LOCALVERSION="-maybe-dirty"/export LOCALVERSION=""/' "$STAMP_BZL"
        fi

    - name: Setup KernelSU
      run: |
        cd gki_build_workspace/common
        KSU_BRANCH="${{ inputs.ksu_branch || 'main' }}"
        echo "Using KernelSU branch: $KSU_BRANCH"
        
        # Manual install to optimize speed (depth=1)
        # Remove existing directory if it exists
        rm -rf KernelSU
        
        # Clone with depth=1
        git clone https://github.com/tiann/KernelSU -b "$KSU_BRANCH" --depth=1 KernelSU
        
        # Add to drivers/Makefile if not present
        # We use 'obj-y' to force include it, avoiding Kconfig dependency issues
        DRIVER_MAKEFILE="drivers/Makefile"
        if ! grep -q "KernelSU" "$DRIVER_MAKEFILE"; then
            echo "obj-y += KernelSU/" >> "$DRIVER_MAKEFILE"
            echo "Added KernelSU to drivers/Makefile"
        else
            echo "KernelSU already in drivers/Makefile"
        fi
        
        # Add symbol to KMI allowlist if needed (KernelSU setup.sh usually does this)
        # We already did this in 'Apply Fixes' step for task_is_booster, 
        # but let's ensure KernelSU symbols are handled if KSU provides a script.
        # For GKI 5.15, usually just cloning and makefile edit is enough.

    - name: Build Kernel
      run: |
        cd gki_build_workspace
        # Build command
        tools/bazel build //common:kernel_aarch64_dist --config=fast

    - name: Package Kernel
      run: |
        cd gki_build_workspace
        
        # Find the built Image
        KERNEL_IMAGE=$(find out/ -name Image | head -n 1)
        echo "Found Kernel Image: $KERNEL_IMAGE"
        
        # 1. Create boot.img
        # GKI usually uses header version 4
        mkbootimg --kernel "$KERNEL_IMAGE" --header_version 4 --output boot.img
        echo "Created boot.img"
        
        # 2. Create AnyKernel3.zip
        git clone https://github.com/osm0sis/AnyKernel3
        rm -rf AnyKernel3/.git
        cp "$KERNEL_IMAGE" AnyKernel3/
        
        # Custom AnyKernel3 config if exists in repo root
        if [ -f "common/anykernel.sh" ]; then
            cp "common/anykernel.sh" AnyKernel3/
            echo "Applied custom anykernel.sh"
        fi
        
        # Create zip
        cd AnyKernel3
        zip -r9 ../AnyKernel3.zip * -x .git README.md *placeholder
        cd ..
        echo "Created AnyKernel3.zip"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Images
        path: |
          gki_build_workspace/out/**/dist/Image
          gki_build_workspace/boot.img
          gki_build_workspace/AnyKernel3.zip
        retention-days: 5
